<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Search</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:52px 18px}.logo{font-size:42px;font-weight:800;letter-spacing:-2px;margin-bottom:24px}.search{display:flex;gap:8px}.search input{flex:1;padding:15px 17px;border:1px solid #d7ddea;border-radius:14px;font-size:17px}.search button{border:0;border-radius:14px;padding:0 22px;font-size:16px;cursor:pointer}.results{margin-top:28px}.card{background:#fff;border:1px solid #e1e5ee;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #1720330d}.title{font-size:19px;font-weight:700}.url{font-size:13px;color:#5d6b82;margin:5px 0}.desc{line-height:1.45;color:#455268}.status{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:8px;font-size:12px;background:#eef2f7}.official{background:#e7f7ec;color:#19733a}.verify{background:#e7f1ff;color:#205ea8}.warning{background:#fff3d9;color:#8a5a00}.unknown{background:#eef2f7;color:#536174}.muted{color:#738096}</style></head><body><main class="wrap"><div class="logo">NOVA</div><div class="search"><input id="q" placeholder="Поиск в интернете"><button id="go">Найти</button></div><div id="meta" class="muted" style="margin-top:14px"></div><section id="results" class="results"></section></main><script>const q=document.getElementById('q'),go=document.getElementById('go'),out=document.getElementById('results'),meta=document.getElementById('meta');async function run(){const query=q.value.trim();if(!query)return;meta.textContent='Ищем…';out.innerHTML='';const t=performance.now();try{const r=await fetch('/api/search?q='+encodeURIComponent(query));const d=await r.json();meta.textContent=`Найдено: ${d.count} · ${(performance.now()-t).toFixed(0)} мс`;out.innerHTML=d.results.map(x=>{const v=x.verification||{};const o=v.officiality||{};let cls=o.status==='CONFIRMED'?'official':v.status==='VERIFIED'?'verify':v.status==='WARNING'?'warning':'unknown';let label=o.status==='CONFIRMED'?'✓ Официальный сайт подтверждён NOVA':v.status==='VERIFIED'?'Техническая проверка пройдена':v.status==='WARNING'?'Есть технические замечания':'Официальность не подтверждена';return `<article class="card"><div class="title"><a href="${x.url}" target="_blank" rel="noopener">${escapeHtml(x.title)}</a></div><div class="url">${escapeHtml(x.url)}</div><div class="desc">${escapeHtml(x.description||'')}</div><span class="status ${cls}">${label}</span></article>`}).join('')}catch(e){meta.textContent='Ошибка поиска';out.innerHTML='<div class="card">Не удалось получить результаты. Проверь запуск сервера.</div>'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}go.onclick=run;q.addEventListener('keydown',e=>{if(e.key==='Enter')run()})</script></body></html>
