name: tests

on:
  push:
    branches: [main, nova-v18-trust-product]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
        working-directory: backend
        env:
          PYTHONPATH: .
      - run: pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/search.test.cjs
